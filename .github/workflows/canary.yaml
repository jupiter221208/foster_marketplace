name: Canary Tests

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      tags:
          description: 'Test scenario tags'
          required: true
          type: choice
          options:
          - 'smoke'
          - 'regression'
          - 'bvt'
          - 'retarget'

jobs:
  deps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x]
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - uses: actions/cache@v2
        id: deps-cache
        with:
          path: ./*
          key: ${{ github.sha }}

  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x]
    needs: [deps]
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Retrieve dependencies
        uses: actions/cache@v2
        id: restore-build
        with:
          path: ./*
          key: ${{ github.sha }}
      - name: Compile TypeScript
        run: tsc --project tsconfig.json

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 18.x]
    needs: [deps]
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Retrieve dependencies
        uses: actions/cache@v2
        id: restore-build
        with:
          path: ./*
          key: ${{ github.sha }}
      - name: Run test
        run: yarn test

  bvt:
    runs-on: ubuntu-latest
    needs: [deps, compile]
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 16.x
        uses: actions/setup-node@v2
        with:
          node-version: "16.x"
      - name: Retrieve dependencies
        uses: actions/cache@v2
        id: restore-build
        with:
          path: ./*
          key: ${{ github.sha }}
      - name: BVT
        run: npm run build
      # - name: Upload Artifact
      #   uses: actions/upload-artifact@v2
      #   with:
      #     name: nextjs-build
      #     path: ./.next
